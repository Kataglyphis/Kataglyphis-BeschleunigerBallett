name: CMake on Windows MSVC/Clang x64 (Container)

on:
  push:
    branches: [main, develop]
    # Docs-only commits must not spend a 2-3h build, and - with the
    # cancel-in-progress concurrency below - must not supersede an in-flight
    # code run either. A backlog edit is not a reason to retest the engine.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on develop and PRs so the tip's verdict arrives without
# queueing behind stale runs - without this every push spawns a full parallel
# 2-3h run and they serialise. main is exempt: its runs deploy/release and must
# not be interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GHCR_IMAGE_WIN: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-win]')
    runs-on: windows-2025
    permissions:
      contents: read
      packages: read
    steps:

     # windows is so funny ... NOT
      # actions/checkout lays down only the superproject (no submodules) so the
      # composite action below and the build scripts exist at the default
      # workspace. The submodules are cloned in the next step, into a short path.
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      # Windows MAX_PATH is the whole problem: the runner's workspace path
      # (D:\a\<repo>\<repo>, the repo name doubled, ~71 chars) plus the deep
      # transitive submodule chain (RustProjectTemplate -> ContainerHub ->
      # DocumANTation -> md2pdfLib -> latex/*) pushes the .git/modules/.../config
      # path past 260 chars, and core.longpaths does not reliably bypass that for
      # these child clones. So clone the WHOLE tree - every submodule, recursively,
      # nothing skipped - into a SHORT path (D:\ws) where the same chain stays well
      # under the limit, then build from there. This mirrors the working local bash
      # workflow; the only fix it needs is a short checkout dir.
      - name: Clone full tree with submodules into a short path (D:\ws)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global core.longpaths true
          # .gitmodules pins git@github.com: (SSH) URLs and the runner has no SSH
          # key; rewrite to token HTTPS as actions/checkout would.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          rm -rf /d/ws
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /d/ws
          git -C /d/ws checkout --force "${{ github.sha }}"
          git -C /d/ws submodule update --init --recursive
      
      # my windows container is quite big ... so remove runner packages for enough
      # dis space
      - name: Cleanup disk space
        uses: ./.github/actions/cleanup-disk-space

      - name: Log in to GHCR (for container image)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: Kataglyphis
          password: ${{ secrets.GHCR_PAT }}

      # The winamd64 image (~54 GB) does not fit in Docker's default data-root on
      # C:. Measured 2026-07-21 after cleanup: C: had 59.3 GB free - only ~5 GB
      # over the image - and hcsshim::ImportLayer needs headroom well beyond the
      # final size, so the pull died with "not enough space (0x70)". D: had
      # 142.6 GB free. So move Docker's data-root to the largest drive BEFORE the
      # pull. Workflow-only fix; no image rebuild. Login lives in the user config,
      # not the data-root, so restarting the service does not drop credentials.
      - name: Move Docker data-root to the largest drive (winamd64 is ~54 GB)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vols = Get-Volume | Where-Object DriveLetter | Sort-Object SizeRemaining -Descending
          $best = $vols | Select-Object -First 1
          $bestLetter = $best.DriveLetter
          $bestFreeGB = [math]::Round($best.SizeRemaining/1GB, 1)
          $root = docker info --format '{{.DockerRootDir}}' 2>$null
          $currentLetter = if ($root -and $root.Length -ge 1) { $root.Substring(0,1) } else { 'C' }
          Write-Host "Docker data-root is on ${currentLetter}: ; largest free drive is ${bestLetter}: ($bestFreeGB GB free)."
          if ($bestLetter -eq $currentLetter) {
            Write-Host "Already on the largest drive; leaving data-root at $root."
          }
          elseif ($bestFreeGB -lt 75) {
            Write-Host "::warning::Largest drive ${bestLetter}: has only $bestFreeGB GB free; a 54 GB import needs ~75 GB of headroom, so relocation may not be enough - the image likely needs slimming."
          }
          else {
            $target = "${bestLetter}:\docker-data"
            Write-Host "Relocating Docker data-root to $target"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Stop-Service docker
            $cfgDir = "$env:ProgramData\docker\config"
            New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
            $cfgPath = Join-Path $cfgDir 'daemon.json'
            $cfg = @{}
            if (Test-Path $cfgPath) {
              try { $cfg = Get-Content $cfgPath -Raw | ConvertFrom-Json -AsHashtable } catch { $cfg = @{} }
            }
            $cfg['data-root'] = $target
            ($cfg | ConvertTo-Json -Depth 10) | Set-Content -Path $cfgPath -Encoding ascii
            Start-Service docker
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { docker info *> $null; if ($LASTEXITCODE -eq 0) { $ok = $true; break } } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ok) { throw "Docker did not come back up after relocating data-root." }
            $now = docker info --format '{{.DockerRootDir}}' 2>$null
            Write-Host "Docker data-root is now: $now"
            if ($now -notlike "$target*") { throw "data-root relocation did not take effect (still $now)." }
          }

      # DIAGNOSTIC (2026-07-21): the winamd64 image is ~54.4 GB, and docker pull
      # has been dying with hcsshim::ImportLayer "not enough space on the disk
      # (0x70)" - it imports the layers into Docker's data-root and the runner
      # runs out of room. Print free space per drive and where Docker stores its
      # layers, at the exact point right before the pull, so we can see whether
      # ANY drive can hold ~54 GB (and if so, whether it is the data-root drive).
      # Pure diagnostic: it does not fail the job.
      - name: Disk space report before pull (winamd64 needs ~54 GB to import)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $vols = Get-Volume | Where-Object DriveLetter | Sort-Object SizeRemaining -Descending
          Write-Host '=== Free space per drive, right before docker pull ==='
          $vols | Format-Table DriveLetter,
            @{n='FreeGB';e={[math]::Round($_.SizeRemaining/1GB,1)}},
            @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
            FileSystemLabel -AutoSize | Out-String | Write-Host
          $root = docker info --format '{{.DockerRootDir}}' 2>$null
          Write-Host "Docker data-root: $root"
          $maxDrive  = ($vols | Select-Object -First 1).DriveLetter
          $maxFreeGB = [math]::Round(($vols | Select-Object -First 1).SizeRemaining/1GB, 1)
          Write-Host "Largest free drive: ${maxDrive}: has $maxFreeGB GB free; winamd64 import needs ~54 GB."
          # Free space on the drive Docker actually imports layers into (data-root).
          $rootDriveFreeGB = $null
          if ($root -and $root.Length -ge 1) {
            $rootLetter = $root.Substring(0,1)
            $rootVol = $vols | Where-Object { $_.DriveLetter -eq $rootLetter } | Select-Object -First 1
            if ($rootVol) { $rootDriveFreeGB = [math]::Round($rootVol.SizeRemaining/1GB,1) }
            Write-Host "Docker data-root drive ${rootLetter}: has $rootDriveFreeGB GB free."
          }
          # Fail FAST with the numbers instead of grinding ~40 min on a doomed
          # pull. Threshold is 75 GB, not 54: hcsshim::ImportLayer needs headroom
          # well beyond the final image size - measured 2026-07-21, a data-root
          # drive with 59.3 GB free still failed to import the 54 GB image. The
          # relocation step above should already have moved the data-root to the
          # largest drive, so this is the backstop for "no drive is big enough".
          if ($rootDriveFreeGB -ne $null -and $rootDriveFreeGB -lt 75) {
            Write-Host "::error::Docker data-root drive ${rootLetter}: has only $rootDriveFreeGB GB free (<75 GB headroom needed for the 54 GB import). Largest drive is ${maxDrive}: with $maxFreeGB GB. Fix: slim the winamd64 image (build.ps1 -Stages base,toolchain, no -Gpu)."
            exit 1
          }

      - name: Build/Test/Package inside ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
        continue-on-error: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'

          docker pull $image
          # Args as a splatted array, NOT backtick line-continuations: the runner
          # checks out this YAML with autocrlf, and a PowerShell backtick before
          # CRLF escapes the CR instead of the newline, breaking the continuation
          # ("Missing expression after unary operator '--'"). An @(...) array spans
          # newlines with no continuation char, so it is CRLF-safe.
          $runArgs = @(
            'run', '--rm', '--memory', '16g', '--cpus', '4',
            '--mount', 'type=bind,source=D:\ws,target=C:\workspace',
            '-w', 'C:\workspace',
            '-e', 'MSIX_CERT_PASSWORD=${{ secrets.MSIX_CERT_PASSWORD }}',
            $image,
            'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'C:\workspace\Scripts\Windows\Build-Windows.ps1',
            '-Configurations', 'clangcl-debug,clangcl-profile,clangcl-release',
            '-SkipFormat', '-SkipTidy', '-SkipTests', '-SkipPerfTests',
            '-WebDavHostname', '${{ secrets.WEBDAV_HOSTNAME }}',
            '-WebDavUsername', '${{ secrets.WEBDAV_USERNAME }}',
            '-WebDavPassword', '${{ secrets.WEBDAV_PASSWORD }}',
            '-RemoteBasePath', '${{ secrets.REMOTE_BASE_PATH }}',
            '-LocalAssetsFolder', 'C:\workspace'
          )
          docker @runArgs

      # Until 2026-07-20 this workflow passed -SkipTests -SkipPerfTests and
      # nothing else ran, so Windows CI proved only that the code compiles -
      # every behavioural guarantee came from a human running the suite locally.
      #
      # The build step above still skips ctest deliberately. GitHub's hosted
      # runners have no GPU, but the container DOES ship the Vulkan loader, so
      # the GPU suites do not reliably self-skip: SKIP_WITHOUT_GPU only asks
      # glfwVulkanSupported(), which can answer yes on a machine with a loader
      # and no device, after which device creation aborts the process. So the
      # GPU suites (Integration, GoldenRender) stay out, by name rather than by
      # hoping they skip, and the CPU-only ones run here.
      #
      # If you add a suite, add it to this filter or it will not run in CI.
      - name: Run CPU-only tests inside the container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'
          $cpuOnlySuites = @(
            'BuildIntegrity.*'
            'CameraUnit.*'
            'SceneConfigUnit.*'
            'CascadedShadowMapUnit.*'
            'GuiSceneVarsRoundTrip.*'
            'HelloTestCommit.*'
          ) -join ':'

          $cmd = "& 'C:\workspace\build-clangcl-debug\commitTestSuite.exe' --gtest_filter='$cpuOnlySuites'; exit `$LASTEXITCODE"
          $runArgs = @(
            'run', '--rm', '--memory', '16g', '--cpus', '4',
            '--mount', 'type=bind,source=D:\ws,target=C:\workspace',
            '-w', 'C:\workspace',
            $image,
            'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $cmd
          )
          docker @runArgs

      # Fuzz targets run their seed corpus in unit-test mode - fast, CPU-only,
      # and the shader-file reader target found a real terminate-on-throw bug
      # from a seed on its first run.
      - name: Run fuzz target seeds inside the container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'

          $cmd = "`$ErrorActionPreference='Stop';
               foreach (`$t in @('obj_parsing_fuzz_test','scene_config_fuzz_test','shader_file_reader_fuzz_test','texture_loading_fuzz_test')) {
                 `$exe = Join-Path 'C:\workspace\build-clangcl-debug' (`$t + '.exe')
                 if (-not (Test-Path `$exe)) { Write-Host \"missing `$exe - fuzz targets are Debug+clang-cl only\"; continue }
                 Write-Host \"--- `$t\"
                 & `$exe
                 if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }
               }
               exit 0"
          $runArgs = @(
            'run', '--rm', '--memory', '16g', '--cpus', '4',
            '--mount', 'type=bind,source=D:\ws,target=C:\workspace',
            '-w', 'C:\workspace',
            $image,
            'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-Command', $cmd
          )
          docker @runArgs

      # I limited the size of the builded package for storage restriction reasons on a github runner
      # see also the install commands in the bottom of the CMakeLists.txt
      - name: Upload Installers & Zip
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installers-container
          path: |
            # legacy/expected CMake preset output
            D:/ws/build_release/**/*.msi
            D:/ws/build_release/**/*.exe
            D:/ws/build_release/**/*.zip
            D:/ws/build_release/**/*.msix
            D:/ws/build_release/**/*.dll
            D:/ws/build_release/**/*.lib
            # also include the build directory used by the PowerShell build script
            D:/ws/build-clangcl-release/**/*.msi
            D:/ws/build-clangcl-release/**/*.msix
            D:/ws/build-clangcl-release/**/*.exe
            D:/ws/build-clangcl-release/**/*.zip
            D:/ws/build-clangcl-release/**/*.dll
            D:/ws/build-clangcl-release/**/*.lib
