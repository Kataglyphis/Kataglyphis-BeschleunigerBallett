name: CMake on Windows MSVC/Clang x64 (Container)

on:
  push:
    branches: [main, develop]
    # Docs-only commits must not spend a 2-3h build, and - with the
    # cancel-in-progress concurrency below - must not supersede an in-flight
    # code run either. A backlog edit is not a reason to retest the engine.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on develop and PRs so the tip's verdict arrives without
# queueing behind stale runs - without this every push spawns a full parallel
# 2-3h run and they serialise. main is exempt: its runs deploy/release and must
# not be interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GHCR_IMAGE_WIN: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  build:
    if: contains(github.event.head_commit.message, '[build-win]')
    runs-on: windows-2025
    permissions:
      contents: read
      packages: read
    steps:

     # windows is so funny ... NOT
      # Submodules are initialised in the bash step below, NOT via actions/checkout:
      # the deep transitive docs chain (ContainerHub -> DocumANTation -> md2pdfLib ->
      # latex/{smile,awesome-beamer}) overflows Windows MAX_PATH on its
      # .git/modules/.../config path. core.longpaths fixes it, but ONLY when git
      # runs in the same shell that set it - the earlier pwsh `git config --global`
      # wrote a gitconfig that Git Bash (different $HOME) never read, so the child
      # clones ran without longpaths. Setting it inside the bash step is what makes
      # the recursive init survive (this mirrors the working local bash workflow).
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      - name: Init submodules (bash, long paths enabled in-shell)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Long paths must be configured HERE, in the bash shell that runs the
          # clones, or the deep .git/modules chain overflows ("$GIT_DIR too big").
          git config --global core.longpaths true
          # .gitmodules pins git@github.com: (SSH) URLs and the runner has no SSH
          # key; actions/checkout (bypassed via submodules:false) is what rewrites
          # them to token HTTPS. Do the same so the clones authenticate over HTTPS.
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          # bash+longpaths handles the top-level ContainerHub docs chain (5 deep),
          # but RustProjectTemplate carries the SAME chain one level deeper (6), whose
          # .git/modules/.../smile/config path overflows MAX_PATH even with longpaths.
          # That chain is docs/CI infra the C++ build never touches (no Rust build.rs
          # references ContainerHub), so recurse everything else and take
          # RustProjectTemplate one level deep - its Rust source only.
          git -c "submodule.ExternalLib/Kataglyphis-RustProjectTemplate.update=none" submodule update --init --recursive
          git submodule update --init ExternalLib/Kataglyphis-RustProjectTemplate
          git submodule update --init ExternalLib/Kataglyphis-RustProjectTemplate
      
      # my windows container is quite big ... so remove runner packages for enough
      # dis space
      - name: Cleanup disk space
        uses: ./.github/actions/cleanup-disk-space

      - name: Log in to GHCR (for container image)
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: Kataglyphis
          password: ${{ secrets.GHCR_PAT }}

      - name: Build/Test/Package inside ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
        continue-on-error: false
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'
    
          docker pull $image
          docker run --rm --memory 16g --cpus 4`
            --mount "type=bind,source=${{ github.workspace }},target=C:\workspace" `
            -w "C:\workspace" `
            -e MSIX_CERT_PASSWORD='${{ secrets.MSIX_CERT_PASSWORD }}' `
            $image `
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File "C:\workspace\Scripts\Windows\Build-Windows.ps1" `
            -Configurations "clangcl-debug,clangcl-profile,clangcl-release" `
            -SkipFormat -SkipTidy -SkipTests -SkipPerfTests `
            -WebDavHostname '${{ secrets.WEBDAV_HOSTNAME }}' `
            -WebDavUsername '${{ secrets.WEBDAV_USERNAME }}' `
            -WebDavPassword '${{ secrets.WEBDAV_PASSWORD }}' `
            -RemoteBasePath '${{ secrets.REMOTE_BASE_PATH }}' `
            -LocalAssetsFolder 'C:\workspace'

      # Until 2026-07-20 this workflow passed -SkipTests -SkipPerfTests and
      # nothing else ran, so Windows CI proved only that the code compiles -
      # every behavioural guarantee came from a human running the suite locally.
      #
      # The build step above still skips ctest deliberately. GitHub's hosted
      # runners have no GPU, but the container DOES ship the Vulkan loader, so
      # the GPU suites do not reliably self-skip: SKIP_WITHOUT_GPU only asks
      # glfwVulkanSupported(), which can answer yes on a machine with a loader
      # and no device, after which device creation aborts the process. So the
      # GPU suites (Integration, GoldenRender) stay out, by name rather than by
      # hoping they skip, and the CPU-only ones run here.
      #
      # If you add a suite, add it to this filter or it will not run in CI.
      - name: Run CPU-only tests inside the container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'
          $cpuOnlySuites = @(
            'BuildIntegrity.*'
            'CameraUnit.*'
            'SceneConfigUnit.*'
            'CascadedShadowMapUnit.*'
            'GuiSceneVarsRoundTrip.*'
            'HelloTestCommit.*'
          ) -join ':'

          docker run --rm --memory 16g --cpus 4 `
            --mount "type=bind,source=${{ github.workspace }},target=C:\workspace" `
            -w "C:\workspace" `
            $image `
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command `
              "& 'C:\workspace\build-clangcl-debug\commitTestSuite.exe' --gtest_filter='$cpuOnlySuites'; exit `$LASTEXITCODE"

      # Fuzz targets run their seed corpus in unit-test mode - fast, CPU-only,
      # and the shader-file reader target found a real terminate-on-throw bug
      # from a seed on its first run.
      - name: Run fuzz target seeds inside the container
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'

          docker run --rm --memory 16g --cpus 4 `
            --mount "type=bind,source=${{ github.workspace }},target=C:\workspace" `
            -w "C:\workspace" `
            $image `
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command `
              "`$ErrorActionPreference='Stop';
               foreach (`$t in @('obj_parsing_fuzz_test','scene_config_fuzz_test','shader_file_reader_fuzz_test','texture_loading_fuzz_test')) {
                 `$exe = Join-Path 'C:\workspace\build-clangcl-debug' (`$t + '.exe')
                 if (-not (Test-Path `$exe)) { Write-Host \"missing `$exe - fuzz targets are Debug+clang-cl only\"; continue }
                 Write-Host \"--- `$t\"
                 & `$exe
                 if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }
               }
               exit 0"

      # I limited the size of the builded package for storage restriction reasons on a github runner
      # see also the install commands in the bottom of the CMakeLists.txt
      - name: Upload Installers & Zip
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installers-container
          path: |
            # legacy/expected CMake preset output
            ${{ github.workspace }}/build_release/**/*.msi
            ${{ github.workspace }}/build_release/**/*.exe
            ${{ github.workspace }}/build_release/**/*.zip
            ${{ github.workspace }}/build_release/**/*.msix
            ${{ github.workspace }}/build_release/**/*.dll
            ${{ github.workspace }}/build_release/**/*.lib
            # also include the build directory used by the PowerShell build script
            ${{ github.workspace }}/build-clangcl-release/**/*.msi
            ${{ github.workspace }}/build-clangcl-release/**/*.msix
            ${{ github.workspace }}/build-clangcl-release/**/*.exe
            ${{ github.workspace }}/build-clangcl-release/**/*.zip
            ${{ github.workspace }}/build-clangcl-release/**/*.dll
            ${{ github.workspace }}/build-clangcl-release/**/*.lib
