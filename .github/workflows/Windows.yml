name: CMake on Windows MSVC/Clang x64 (Container)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true
  BUILD_DIR: build
  BUILD_DIR_RELEASE: build_release
  LLVM_BIN: C:\Program Files\LLVM\bin
  CLANG_PROFILE_PRESET: x64-ClangCL-Windows-Profile
  GHCR_IMAGE_WIN: ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Log in to GHCR (for container image)
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build/Test/Package inside ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $image = 'ghcr.io/kataglyphis/kataglyphis_beschleuniger:winamd64'
          docker pull $image

          $workspace = "${{ github.workspace }}"

          docker run --rm `
            -v "${workspace}:C:\\workspace" `
            -w "C:\\workspace" `
            -e "BUILD_DIR=${{ env.BUILD_DIR }}" `
            -e "BUILD_DIR_RELEASE=${{ env.BUILD_DIR_RELEASE }}" `
            -e "CLANG_PROFILE_PRESET=${{ env.CLANG_PROFILE_PRESET }}" `
            -e "CLANG_VERSION=${{ env.CLANG_VERSION }}" `
            $image `
            pwsh -NoProfile -File "C:\\workspace\\Scripts\\Windows\\ci.ps1"

      # I limited the size of the builded package for storage restriction reasons on a github runner
      # see also the install commands in the bottom of the CMakeLists.txt
      - name: Upload Installers & Zip
        uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-installers-container
          path: |
            ${{ github.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.msi
            ${{ github.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.exe
            ${{ github.workspace }}/${{ env.BUILD_DIR_RELEASE }}/*.zip