name: Linux build + test + coverage on Ubuntu 24.04 x86

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on develop and PRs so the tip's verdict arrives without
# queueing behind stale runs - without this every push spawns a full parallel
# 2-3h run and they serialise. main is exempt: its runs deploy/release and must
# not be interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-x64:
    uses: ./.github/workflows/Linux.yml
    with:
      runner: ubuntu-24.04
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
