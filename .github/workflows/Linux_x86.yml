name: Linux build + test + coverage on Ubuntu 24.04 x86

on:
  push:
    branches: [main, develop]
    # Docs-only commits must not spend a 2-3h build, and - with the
    # cancel-in-progress concurrency below - must not supersede an in-flight
    # code run either. A backlog edit is not a reason to retest the engine.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, develop]
  # A docs-only commit is correctly skipped by paths-ignore above, but a fix TO
  # a docs file the test suite pins (docs/gpu-golden-testing.md's golden-counts
  # marker, which BuildIntegrity.GoldenTestCountsInDocsMatchTheSuite compares
  # against the suite source) is exactly the case where the engine DOES need
  # retesting and no code file changed. Without a manual trigger the only way to
  # get a verdict on such a fix was to bundle an unrelated code edit with it.
  workflow_dispatch:

# Cancel superseded runs on develop and PRs so the tip's verdict arrives without
# queueing behind stale runs - without this every push spawns a full parallel
# 2-3h run and they serialise. main is exempt: its runs deploy/release and must
# not be interrupted mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-x64:
    uses: ./.github/workflows/Linux.yml
    with:
      runner: ubuntu-24.04
    secrets:
      SERVER: ${{ secrets.SERVER }}
      USERNAME: ${{ secrets.USERNAME }}
      PW: ${{ secrets.PW }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
