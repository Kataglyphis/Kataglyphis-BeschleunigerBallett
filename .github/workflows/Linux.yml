name: Linux build reusable

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      CODECOV_TOKEN:
        required: true
      GHCR_PAT:
        required: true

# Every build step here pipes through `tee`, and the runner's default shell
# has no pipefail - so for months, failed configures and builds reported
# SUCCESS and only steps without tee (the fuzzer run) ever surfaced failure.
# An explicit `shell: bash` runs with `-eo pipefail`, which unmasks them.
defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Debug
  GCC_PROFILE_PRESET: linux-profile-GNU
  CLANG_PROFILE_PRESET: linux-profile-clang
  VULKAN_VERSION: 1.4.341.1
  # folder/name configuration -- change here to affect the whole workflow
  BUILD_DIR: build
  BUILD_RELEASE_DIR: build-release
  DOCS_OUT: build/build/html
  COVERAGE_JSON: build/coverage.json
  # :latest-cross, NOT :latest. The plain tag is the old single-arch build and
  # had not been rebuilt since 2026-04-16 - three months of toolchain drift
  # behind the cross lane, which is rebuilt routinely (2026-07-20 at the time
  # of writing). Both publish linux/amd64, arm64 and riscv64. Use the same tag
  # locally so a CI failure is reproducible on a dev box; see ContainerHub
  # docs/rancher-desktop-linux-containers.md.
  CONTAINER_IMAGE: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest-cross

jobs:
  build_and_test:
    runs-on: ${{ inputs.runner }}
    # Run this job inside the GHCR container:

    steps:
      - name: Free Disk Space on Host
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull container image
        run: |
          for i in 1 2 3; do
            echo "Attempt $i to pull container (${{ inputs.runner }})..."
            if timeout 900 docker pull "${{ env.CONTAINER_IMAGE }}"; then
              echo "Successfully pulled container"
              exit 0
            fi
            echo "Pull failed, waiting before retry..."
            sleep 30
          done
          echo "Failed to pull container after 3 attempts"
          exit 1

      #################################################################################################################
      ####################### Run unit/integration/fuzzy/coverage/tests/static analyzers ##############################
      #################################################################################################################
      #################################################################################################################
      ############################################### clang: build/test ################################################
      #################################################################################################################

      - name: Prepare for unit/integration tests
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0" \
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --preset "linux-debug-clang" \
            --build-dir "${{ env.BUILD_DIR }}" 2>&1 | tee output.log

      - name: Run Unit/Integration tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run-ctest.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --build-type "${{ env.BUILD_TYPE }}" \
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder" 2>&1 | tee output.log

      # AddressSanitizer + UBSan: catches the memory errors the OBJ-loader
      # hardening was about. Non-GPU tests only.
      - name: Configure/build with AddressSanitizer
        run: |
          docker run --rm             -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0"             -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0"             -v ${{ github.workspace }}:/workspace             -w /workspace             "${{ env.CONTAINER_IMAGE }}"             bash ./Scripts/Linux/cmake-configure-build.sh             --vulkan-version "${{ env.VULKAN_VERSION }}"             --preset "linux-debug-asan-clang"             --build-dir "build-asan-clang" 2>&1 | tee output-asan.log

      # Fuzz targets run from the ASAN build, NOT the plain Debug one.
      #
      # They used to run from ${{ env.BUILD_DIR }}, where only the fuzz target
      # itself carried -fsanitize=address while the abseil FuzzTest links
      # against did not. Abseil's container layout is ASan-dependent, so that
      # is an ODR violation, and it crashed on startup - reproduced locally in
      # this same image: raw_hash_set.h "Try enabling sanitizers." assertion
      # with per-target ASan, all tests passing with ASan applied to every TU.
      # It broke the lane from 2026-05-17 until 2026-07-20.
      - name: Run fuzzer tests
        run: |
          build-asan-clang/first_fuzz_test
          # Real engine surface: OBJ parsing hardening (ObjLoader mirror).
          build-asan-clang/obj_parsing_fuzz_test
          # Real engine surface: scene-config path resolution.
          build-asan-clang/scene_config_fuzz_test
        working-directory: ${{ github.workspace }}

      - name: Run tests under AddressSanitizer
        run: |
          docker run --rm             -e ASAN_OPTIONS="detect_leaks=1:abort_on_error=1"             -e UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"             -v ${{ github.workspace }}:/workspace             -w /workspace             "${{ env.CONTAINER_IMAGE }}"             bash ./Scripts/Linux/run-ctest.sh             --vulkan-version "${{ env.VULKAN_VERSION }}"             --build-dir "build-asan-clang"             --build-type "${{ env.BUILD_TYPE }}"             --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder" 2>&1 | tee output-asan.log

      # ThreadSanitizer: the presets existed but nothing ever ran them, so
      # data races could only be found by hand. Non-GPU tests only - the
      # Integration suites need an adapter the CI container does not have.
      - name: Configure/build with ThreadSanitizer
        run: |
          docker run --rm             -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0"             -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0"             -v ${{ github.workspace }}:/workspace             -w /workspace             "${{ env.CONTAINER_IMAGE }}"             bash ./Scripts/Linux/cmake-configure-build.sh             --vulkan-version "${{ env.VULKAN_VERSION }}"             --preset "linux-debug-tsan-clang"             --build-dir "build-tsan" 2>&1 | tee output-tsan.log

      - name: Run tests under ThreadSanitizer
        run: |
          docker run --rm             -e TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1"             -v ${{ github.workspace }}:/workspace             -w /workspace             "${{ env.CONTAINER_IMAGE }}"             bash ./Scripts/Linux/run-ctest.sh             --vulkan-version "${{ env.VULKAN_VERSION }}"             --build-dir "build-tsan"             --build-type "${{ env.BUILD_TYPE }}"             --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder" 2>&1 | tee output-tsan.log

      - name: Build Code Coverage
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/build-coverage-llvm.sh \
            --build-dir "${{ env.BUILD_DIR }}" \
            --coverage-json "${{ env.COVERAGE_JSON }}" 2>&1 | tee output.log
        working-directory: ${{ github.workspace }}

      - name: Codecov
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_JSON }}
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false

      # runs for ever so disable
      #- name: Run clang tidy
      #  continue-on-error: true
      #  run: clang-tidy -p=./${{ env.BUILD_DIR }}/compile_commands.json  $(find Src -name '*.cpp' -o -name '*.cc')

      - name: Run Clang static analysis (HTML)
        continue-on-error: true
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0" \
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run_static_analysis_format.sh \
            --only-clang-analyze-html 2>&1 | tee output.log 

      - name: Run Clang static analysis (scan-build)
        continue-on-error: true
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0" \
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run_static_analysis_format.sh \
            --only-scan-build \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "linux-debug-clang" 2>&1 | tee output.log

      #################################################################################################################
      ############################# Now run on performance benchmarking/profiling #####################################
      #################################################################################################################
      - name: Configure/build CMake for Profiling (select preset by compiler)
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0" \
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "${{ env.CLANG_PROFILE_PRESET }}" \
            --clean-build-dir true 2>&1 | tee output.log

      - name: Run performance benchmarks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run-perf-suite.sh "${{ env.BUILD_DIR }}" 2>&1 | tee output.log

      #################################################################################################################
      ######################################## Build docs #############################################################
      #################################################################################################################

      - name: Build web page
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/docs-build-web.sh "${{ env.DOCS_OUT }}"

      - name: 📂 Sync files to domain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/build/html/"

      #################################################################################################################
      ############################################### gcc: build/test #################################################
      #################################################################################################################

      - name: Prepare for unit/integration tests (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "linux-debug-GNU" \
            --clean-build-dir true 2>&1 | tee output.log

      - name: Run Unit/Integration tests (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run-ctest.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --build-type "${{ env.BUILD_TYPE }}" \
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder" 2>&1 | tee output.log

      - name: Run fuzzer tests (gcc)
        run: |
          echo "Compiled with GCC so no fuzz testing!"
        working-directory: ${{ github.workspace }}

      - name: Build Code Coverage (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/build-coverage-gcovr.sh 2>&1 | tee output.log

      - name: Configure/build CMake for Profiling (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "${{ env.GCC_PROFILE_PRESET }}" \
            --clean-build-dir true 2>&1 | tee output.log

      - name: Run performance benchmarks (gcc)
        run: ./Scripts/Linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
        working-directory: ${{ github.workspace }}

      #################################################################################################################
      ######################################## Release: build + package ################################################
      #################################################################################################################

      - name: Configure/build CMake for Release
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0" \
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_RELEASE_DIR }}" \
            --preset "linux-release-clang" \
            --build-config "Release" 2>&1 | tee output.log

      - name: Package
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0" \
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_RELEASE_DIR }}" \
            --skip-configure true \
            --build-target package 2>&1 | tee output.log

      - name: Upload Linux Packages (Clang only)
        uses: actions/upload-artifact@v7.0.0
        with:
          name: linux-packages
          path: |
            ${{ env.BUILD_RELEASE_DIR }}/*.tar.gz
            ${{ env.BUILD_RELEASE_DIR }}/*.tgz
            ${{ env.BUILD_RELEASE_DIR }}/*.deb
            ${{ env.BUILD_RELEASE_DIR }}/*.AppImage
            ${{ env.BUILD_RELEASE_DIR }}/*.flatpak
