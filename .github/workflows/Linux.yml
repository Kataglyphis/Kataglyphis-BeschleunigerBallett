name: Linux build reusable

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      CODECOV_TOKEN:
        required: true
      GHCR_PAT:
        required: true

env:
  BUILD_TYPE: Debug
  GCC_PROFILE_PRESET: linux-profile-GNU
  CLANG_PROFILE_PRESET: linux-profile-clang
  VULKAN_VERSION: 1.4.341.1
  # folder/name configuration -- change here to affect the whole workflow
  BUILD_DIR: build
  BUILD_RELEASE_DIR: build-release
  DOCS_OUT: build/build/html
  COVERAGE_JSON: build/coverage.json
  CONTAINER_IMAGE: ghcr.io/kataglyphis/kataglyphis_beschleuniger:latest

jobs:
  build_and_test:
    runs-on: ${{ inputs.runner }}
    # Run this job inside the GHCR container:

    steps:
      - name: Free Disk Space on Host
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull container image
        run: |
          for i in 1 2 3; do
            echo "Attempt $i to pull container (${{ inputs.runner }})..."
            if timeout 900 docker pull "${{ env.CONTAINER_IMAGE }}"; then
              echo "Successfully pulled container"
              exit 0
            fi
            echo "Pull failed, waiting before retry..."
            sleep 30
          done
          echo "Failed to pull container after 3 attempts"
          exit 1

      #################################################################################################################
      ####################### Run unit/integration/fuzzy/coverage/tests/static analyzers ##############################
      #################################################################################################################
      #################################################################################################################
      ############################################### clang: build/test ################################################
      #################################################################################################################

      - name: Prepare for unit/integration tests
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-15.2.0" \
            -e LDFLAGS="-L/opt/gcc-15.2.0/lib64 -Wl,-rpath,/opt/gcc-15.2.0/lib64 --gcc-toolchain=/opt/gcc-15.2.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --preset "linux-debug-clang" \
            --build-dir "${{ env.BUILD_DIR }}" 2>&1 | tee output.log

      - name: Run Unit/Integration tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run-ctest.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --build-type "${{ env.BUILD_TYPE }}" \
            --ctest-exclude "^Integration\\.VulkanEngine$" 2>&1 | tee output.log

      - name: Run fuzzer tests
        run: |
          ${{ env.BUILD_DIR }}/first_fuzz_test
          # Real engine surface: OBJ parsing hardening (ObjLoader mirror).
          ${{ env.BUILD_DIR }}/obj_parsing_fuzz_test
        working-directory: ${{ github.workspace }}

      - name: Build Code Coverage
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/build-coverage-llvm.sh \
            --build-dir "${{ env.BUILD_DIR }}" \
            --coverage-json "${{ env.COVERAGE_JSON }}" 2>&1 | tee output.log
        working-directory: ${{ github.workspace }}

      - name: Codecov
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_JSON }}
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false

      # runs for ever so disable
      #- name: Run clang tidy
      #  continue-on-error: true
      #  run: clang-tidy -p=./${{ env.BUILD_DIR }}/compile_commands.json  $(find Src -name '*.cpp' -o -name '*.cc')

      - name: Run Clang static analysis (HTML)
        continue-on-error: true
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-15.2.0" \
            -e LDFLAGS="-L/opt/gcc-15.2.0/lib64 -Wl,-rpath,/opt/gcc-15.2.0/lib64 --gcc-toolchain=/opt/gcc-15.2.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run_static_analysis_format.sh \
            --only-clang-analyze-html 2>&1 | tee output.log 

      - name: Run Clang static analysis (scan-build)
        continue-on-error: true
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-15.2.0" \
            -e LDFLAGS="-L/opt/gcc-15.2.0/lib64 -Wl,-rpath,/opt/gcc-15.2.0/lib64 --gcc-toolchain=/opt/gcc-15.2.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run_static_analysis_format.sh \
            --only-scan-build \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "linux-debug-clang" 2>&1 | tee output.log

      #################################################################################################################
      ############################# Now run on performance benchmarking/profiling #####################################
      #################################################################################################################
      - name: Configure/build CMake for Profiling (select preset by compiler)
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-15.2.0" \
            -e LDFLAGS="-L/opt/gcc-15.2.0/lib64 -Wl,-rpath,/opt/gcc-15.2.0/lib64 --gcc-toolchain=/opt/gcc-15.2.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "${{ env.CLANG_PROFILE_PRESET }}" \
            --clean-build-dir true 2>&1 | tee output.log

      - name: Run performance benchmarks
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run-perf-suite.sh "${{ env.BUILD_DIR }}" 2>&1 | tee output.log

      #################################################################################################################
      ######################################## Build docs #############################################################
      #################################################################################################################

      - name: Build web page
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/docs-build-web.sh "${{ env.DOCS_OUT }}"

      - name: 📂 Sync files to domain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/build/html/"

      #################################################################################################################
      ############################################### gcc: build/test #################################################
      #################################################################################################################

      - name: Prepare for unit/integration tests (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "linux-debug-GNU" \
            --clean-build-dir true 2>&1 | tee output.log

      - name: Run Unit/Integration tests (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/run-ctest.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --build-type "${{ env.BUILD_TYPE }}" \
            --ctest-exclude "^Integration\\.VulkanEngine$" 2>&1 | tee output.log

      - name: Run fuzzer tests (gcc)
        run: |
          echo "Compiled with GCC so no fuzz testing!"
        working-directory: ${{ github.workspace }}

      - name: Build Code Coverage (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/build-coverage-gcovr.sh 2>&1 | tee output.log

      - name: Configure/build CMake for Profiling (gcc)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_DIR }}" \
            --preset "${{ env.GCC_PROFILE_PRESET }}" \
            --clean-build-dir true 2>&1 | tee output.log

      - name: Run performance benchmarks (gcc)
        run: ./Scripts/Linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
        working-directory: ${{ github.workspace }}

      #################################################################################################################
      ######################################## Release: build + package ################################################
      #################################################################################################################

      - name: Configure/build CMake for Release
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-15.2.0" \
            -e LDFLAGS="-L/opt/gcc-15.2.0/lib64 -Wl,-rpath,/opt/gcc-15.2.0/lib64 --gcc-toolchain=/opt/gcc-15.2.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_RELEASE_DIR }}" \
            --preset "linux-release-clang" \
            --build-config "Release" 2>&1 | tee output.log

      - name: Package
        run: |
          docker run --rm \
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-15.2.0" \
            -e LDFLAGS="-L/opt/gcc-15.2.0/lib64 -Wl,-rpath,/opt/gcc-15.2.0/lib64 --gcc-toolchain=/opt/gcc-15.2.0" \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            "${{ env.CONTAINER_IMAGE }}" \
            bash ./Scripts/Linux/cmake-configure-build.sh \
            --vulkan-version "${{ env.VULKAN_VERSION }}" \
            --build-dir "${{ env.BUILD_RELEASE_DIR }}" \
            --skip-configure true \
            --build-target package 2>&1 | tee output.log

      - name: Upload Linux Packages (Clang only)
        uses: actions/upload-artifact@v7.0.0
        with:
          name: linux-packages
          path: |
            ${{ env.BUILD_RELEASE_DIR }}/*.tar.gz
            ${{ env.BUILD_RELEASE_DIR }}/*.tgz
            ${{ env.BUILD_RELEASE_DIR }}/*.deb
            ${{ env.BUILD_RELEASE_DIR }}/*.AppImage
            ${{ env.BUILD_RELEASE_DIR }}/*.flatpak
