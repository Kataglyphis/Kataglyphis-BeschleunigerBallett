name: Linux build reusable

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
    secrets:
      SERVER:
        required: true
      USERNAME:
        required: true
      PW:
        required: true
      CODECOV_TOKEN:
        required: true
      GHCR_PAT:
        required: true

# Every build step here pipes through `tee`, and the runner's default shell
# has no pipefail - so for months, failed configures and builds reported
# SUCCESS and only steps without tee (the fuzzer run) ever surfaced failure.
# An explicit `shell: bash` runs with `-eo pipefail`, which unmasks them.
defaults:
  run:
    shell: bash

env:
  BUILD_TYPE: Debug
  GCC_PROFILE_PRESET: linux-profile-GNU
  CLANG_PROFILE_PRESET: linux-profile-clang
  # Vulkan SDK version is NOT set here: the container already exports
  # VULKAN_VERSION (ContainerHub linux/Dockerfile.base), and
  # cmake-configure-build.sh only overrides it when --vulkan-version is
  # passed - so repeating it here was redundant.
  # folder/name configuration -- change here to affect the whole workflow
  BUILD_DIR: build
  BUILD_RELEASE_DIR: build-release
  DOCS_OUT: build/build/html
  COVERAGE_JSON: build/coverage.json
  # The cross lane, NOT :latest. The plain tag is the old single-arch build and
  # had not been rebuilt since 2026-04-16 - three months of toolchain drift
  # behind the cross lane, which is rebuilt routinely. Worse, :latest's manifest
  # list still ADVERTISES amd64/arm64/riscv64 but every child manifest it points
  # at now 404s (MANIFEST_UNKNOWN) - it is not a fallback for anything.
  #
  # Per-ARCH tag, not the :latest-cross index (verified against GHCR 2026-08-04):
  # the :latest-cross manifest list contains exactly ONE entry, linux/amd64, so
  # `docker pull` on ubuntu-24.04-arm died with "no matching manifest for
  # linux/arm64/v8 in the manifest list entries" - three attempts, then the whole
  # ARM lane. The arch-specific tags ContainerHub pushes alongside the index are
  # both present and current (:latest-cross-amd64 built 2026-07-26,
  # :latest-cross-arm64 built 2026-07-24), and :latest-cross-amd64 resolves to
  # the very same image the index serves today, so naming them directly costs the
  # x86 lane nothing and stops the ARM lane depending on an index that has never
  # listed it. Use the same tag locally so a CI failure is reproducible on a dev
  # box; see ContainerHub docs/rancher-desktop-linux-containers.md.
  CONTAINER_IMAGE: "ghcr.io/kataglyphis/kataglyphis_beschleuniger:${{ inputs.runner == 'ubuntu-24.04-arm' && 'latest-cross-arm64' || 'latest-cross-amd64' }}"

jobs:
  build_and_test:
    runs-on: ${{ inputs.runner }}
    # Run this job inside the GHCR container:

    steps:
      - name: Free Disk Space on Host
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull container image
        run: |
          for i in 1 2 3; do
            echo "Attempt $i to pull container (${{ inputs.runner }})..."
            if timeout 900 docker pull "${{ env.CONTAINER_IMAGE }}"; then
              echo "Successfully pulled container"
              exit 0
            fi
            echo "Pull failed, waiting before retry..."
            sleep 30
          done
          echo "Failed to pull container after 3 attempts"
          exit 1

      #################################################################################################################
      ####################### Run unit/integration/fuzzy/coverage/tests/static analyzers ##############################
      #################################################################################################################
      #################################################################################################################
      ############################################### clang: build/test ################################################
      #################################################################################################################

      - name: Prepare for unit/integration tests
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --preset "linux-debug-clang"
            --build-dir "${{ env.BUILD_DIR }}"
          log-file: output.log

      - name: Run Unit/Integration tests
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/run-ctest.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder"
          log-file: output.log

      # AddressSanitizer + UBSan: catches the memory errors the OBJ-loader
      # hardening was about. Non-GPU tests only.
      - name: Configure/build with AddressSanitizer
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --preset "linux-debug-asan-clang"
            --build-dir "build-asan-clang"
          log-file: output-asan.log

      # Fuzz targets run from the ASAN build, NOT the plain Debug one.
      #
      # They used to run from ${{ env.BUILD_DIR }}, where only the fuzz target
      # itself carried -fsanitize=address while the abseil FuzzTest links
      # against did not. Abseil's container layout is ASan-dependent, so that
      # is an ODR violation, and it crashed on startup - reproduced locally in
      # this same image: raw_hash_set.h "Try enabling sanitizers." assertion
      # with per-target ASan, all tests passing with ASan applied to every TU.
      # It broke the lane from 2026-05-17 until 2026-07-20.
      #
      # Every target declared in Test/fuzz/CMakeLists.txt runs here - see that
      # file for what each one covers (shader_file_reader_fuzz_test and
      # texture_loading_fuzz_test both link VulkanEngineCore, the same
      # headless-global-constructor hazard scene_config_fuzz_test's comment
      # describes). Test/commit/VulkanEngine/buildIntegritySuite.cpp's
      # BuildIntegrity.EveryRegisteredFuzzTargetRunsInCi gates this list
      # against the CMakeLists.txt declarations, and the existence check below
      # turns a renamed or unbuilt target into a loud failure instead of a
      # step that silently runs fewer fuzzers than it claims to.
      # Each target runs INSIDE the image it was built in, like every other
      # test step in this lane. It used to run them straight on the runner
      # host - the only step here that did - which is a different libstdc++
      # (the image builds against /opt/gcc-16.1.0, absent on the host), no
      # llvm-symbolizer (every ASan report came back "invalid path to external
      # symbolizer", unsymbolized frame addresses only), and none of the
      # runtime the engine-linked targets expect. Same docker run shape as the
      # run-in-linux-container action; it is spelled out here because the
      # action takes one command line and this needs a loop that keeps going
      # after a failure.
      #
      # Collecting failures instead of aborting on the first is the point of
      # the loop: with `set -e` semantics the first bad target hid the verdict
      # on every target after it, so each round trip revealed exactly one
      # broken fuzzer out of seven.
      # A hanging fuzz target must fail the step, not sit until the 6-hour job
      # cap: on 2026-08-05 the Windows twin of this step spent 68 minutes
      # inside one seed ("con", the Windows console device, which readTextFile
      # opened and then read forever) and had to be killed by hand. Seven
      # targets need well under a minute in total here.
      - name: Run fuzzer tests
        timeout-minutes: 15
        run: |
          failed=""
          for t in first_fuzz_test example_fuzz_test obj_parsing_fuzz_test gltf_parsing_fuzz_test scene_config_fuzz_test shader_file_reader_fuzz_test texture_loading_fuzz_test; do
            exe="build-asan-clang/$t"
            test -x "$exe" || { echo "missing $exe"; exit 1; }
            echo "--- $t"
            if docker run --rm \
                 -v "${{ github.workspace }}:/workspace" \
                 -w /workspace \
                 "${{ env.CONTAINER_IMAGE }}" \
                 "./$exe"; then
              echo "--- $t OK"
            else
              echo "::error::fuzz target $t failed"
              failed="$failed $t"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzz targets failed:$failed"
            exit 1
          fi
        working-directory: ${{ github.workspace }}

      - name: Run tests under AddressSanitizer
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: >-
            -e ASAN_OPTIONS="detect_leaks=1:abort_on_error=1"
            -e UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=1"
          script: >-
            bash ./Scripts/Linux/run-ctest.sh
            --build-dir "build-asan-clang"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder"
          log-file: output-asan.log

      # ThreadSanitizer: the presets existed but nothing ever ran them, so
      # data races could only be found by hand. Non-GPU tests only - the
      # Integration suites need an adapter the CI container does not have.
      - name: Configure/build with ThreadSanitizer
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --preset "linux-debug-tsan-clang"
            --build-dir "build-tsan"
          log-file: output-tsan.log

      - name: Run tests under ThreadSanitizer
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: >-
            -e TSAN_OPTIONS="halt_on_error=1:second_deadlock_stack=1"
          script: >-
            bash ./Scripts/Linux/run-ctest.sh
            --build-dir "build-tsan"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\.|^BuildIntegrity\.CompiledShadersAreNotOlder"
          log-file: output-tsan.log

      - name: Build Code Coverage
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/build-coverage-llvm.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --coverage-json "${{ env.COVERAGE_JSON }}"
          log-file: output.log

      - name: Codecov
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_JSON }}
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: false

      # runs for ever so disable
      #- name: Run clang tidy
      #  continue-on-error: true
      #  run: clang-tidy -p=./${{ env.BUILD_DIR }}/compile_commands.json  $(find Src -name '*.cpp' -o -name '*.cc')

      # The ONLY step that still needs CXXFLAGS/LDFLAGS in the environment: it
      # runs `clang++ --analyze` DIRECTLY (run_static_analysis_format.sh), with
      # no CMake and no preset, so it cannot inherit the --gcc-toolchain flags
      # that CMakePresets.json now carries for every preset-driven step. Without
      # them clang++ would resolve libstdc++ headers from the system GCC instead
      # of /opt/gcc-16.1.0.
      - name: Run Clang static analysis (HTML)
        continue-on-error: true
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          extra-args: >-
            -e CXXFLAGS="--gcc-toolchain=/opt/gcc-16.1.0"
            -e LDFLAGS="-L/opt/gcc-16.1.0/lib64 -Wl,-rpath,/opt/gcc-16.1.0/lib64 --gcc-toolchain=/opt/gcc-16.1.0"
          script: >-
            bash ./Scripts/Linux/run_static_analysis_format.sh
            --only-clang-analyze-html
          log-file: output.log

      - name: Run Clang static analysis (scan-build)
        continue-on-error: true
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/run_static_analysis_format.sh
            --only-scan-build
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "linux-debug-clang"
          log-file: output.log

      #################################################################################################################
      ############################# Now run on performance benchmarking/profiling #####################################
      #################################################################################################################
      - name: Configure/build CMake for Profiling (select preset by compiler)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "${{ env.CLANG_PROFILE_PRESET }}"
            --clean-build-dir true
          log-file: output.log

      - name: Run performance benchmarks
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: bash ./Scripts/Linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
          log-file: output.log

      # The Rust bridge and the wasm demo are both compiled from this crate
      # elsewhere in this lane, but neither run its ~150 tests - this is the
      # only place in this repo that does. GPU-touching tests self-skip
      # without an adapter (see Scripts/Linux/run-cargo-tests.sh). ARM does
      # not pay for a second run of the same crate's CPU-only tests.
      - name: Run Rust renderer tests
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: bash ./Scripts/Linux/run-cargo-tests.sh
          log-file: output.log

      #################################################################################################################
      ######################################## Build docs #############################################################
      #################################################################################################################

      - name: Build web page
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: bash ./Scripts/Linux/docs-build-web.sh "${{ env.DOCS_OUT }}"

      - name: Enforce wasm demo size budget
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        # Deliberately fatal, unlike the best-effort rebuild in "Build web
        # page" above: a wasm bloat regression must block the deploy step
        # below, not surface as a slow page load after it is already live.
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: bash ./Scripts/Linux/wasm-size-budget.sh

      - name: 📂 Sync files to domain
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        if: ${{ inputs.runner == 'ubuntu-24.04' }}
        # A flaky FTP upload of the docs must not red the whole build+test lane:
        # the code already compiled and passed both the clang/ASan and gcc test
        # runs before this deploy step. Mirrors the RPT fix (continue-on-error on
        # its FTP deploy) - the docs push is best-effort, not a gate.
        continue-on-error: true
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./docs/build/html/"

      #################################################################################################################
      ############################################### gcc: build/test #################################################
      #################################################################################################################

      - name: Prepare for unit/integration tests (gcc)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "linux-debug-GNU"
            --clean-build-dir true
          log-file: output.log

      - name: Run Unit/Integration tests (gcc)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/run-ctest.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --build-type "${{ env.BUILD_TYPE }}"
            --ctest-exclude "^(Integration|GoldenRender)\\.|^BuildIntegrity\\.CompiledShadersAreNotOlder"
          log-file: output.log

      - name: Run fuzzer tests (gcc)
        run: |
          echo "Compiled with GCC so no fuzz testing!"
        working-directory: ${{ github.workspace }}

      - name: Build Code Coverage (gcc)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: bash ./Scripts/Linux/build-coverage-gcovr.sh
          log-file: output.log

      - name: Configure/build CMake for Profiling (gcc)
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_DIR }}"
            --preset "${{ env.GCC_PROFILE_PRESET }}"
            --clean-build-dir true
          log-file: output.log

      - name: Run performance benchmarks (gcc)
        run: ./Scripts/Linux/run-perf-suite.sh "${{ env.BUILD_DIR }}"
        working-directory: ${{ github.workspace }}

      #################################################################################################################
      ######################################## Release: build + package ################################################
      #################################################################################################################

      - name: Configure/build CMake for Release
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_RELEASE_DIR }}"
            --preset "linux-release-clang"
            --build-config "Release"
          log-file: output.log

      - name: Package
        uses: Kataglyphis/Kataglyphis-ContainerHub/.github/actions/run-in-linux-container@main
        with:
          image: ${{ env.CONTAINER_IMAGE }}
          script: >-
            bash ./Scripts/Linux/cmake-configure-build.sh
            --build-dir "${{ env.BUILD_RELEASE_DIR }}"
            --skip-configure true
            --build-target package
          log-file: output.log

      - name: Upload Linux Packages (Clang only)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-packages
          path: |
            ${{ env.BUILD_RELEASE_DIR }}/*.tar.gz
            ${{ env.BUILD_RELEASE_DIR }}/*.tgz
            ${{ env.BUILD_RELEASE_DIR }}/*.deb
            ${{ env.BUILD_RELEASE_DIR }}/*.AppImage
            ${{ env.BUILD_RELEASE_DIR }}/*.flatpak
